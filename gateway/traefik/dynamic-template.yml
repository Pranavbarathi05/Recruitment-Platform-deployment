# ══════════════════════════════════════════════════════════════════════════════
# Traefik Dynamic Configuration — App 1 External Service
#
# This file is a template. At container startup, APP1_URL is substituted
# into the service URL. The result is written to dynamic.yml.
#
# DO NOT edit dynamic.yml directly — it is regenerated from this template.
# ══════════════════════════════════════════════════════════════════════════════

http:
  services:
    app1-backend:
      loadBalancer:
        servers:
          - url: "${APP1_URL}"

  routers:
    app1-external:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - web
      service: app1-backend
      priority: 1
