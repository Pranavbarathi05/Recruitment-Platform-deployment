# ══════════════════════════════════════════════════════════════════════════════
# Compiler 1 – Standalone Docker Compose
#
# Run independently from the gateway stack.
# Does NOT require dsc-recruit, Supabase, or the gateway.
#
# Usage:
#   docker compose up -d --build
#   curl http://localhost:8001/health
#   docker compose down
# ══════════════════════════════════════════════════════════════════════════════

services:

  compiler-1:
    build:
      context: ..
      dockerfile: compiler-1/Dockerfile
    container_name: compiler-1
    restart: unless-stopped
    environment:
      COMPILER_VERSION: "0.1.0"
      MAX_CONCURRENT: ${MAX_CONCURRENT:-4}
    ports:
      - "${COMPILER_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
