# ══════════════════════════════════════════════════════════════════════════════
# Recruitment Platform – Gateway (Phase 2: LAN Deployment)
# ══════════════════════════════════════════════════════════════════════════════
# Services:
#   traefik       – reverse proxy / load balancer (entry point)
#   gateway-api   – session control plane, health, admin (/api/*)
#
# Routing:
#   GET /api/*        → gateway-api  (priority 10, control plane)
#   GET /*            → App 1 via LAN (priority 1, external service)
#
# App 1 is on a SEPARATE PHYSICAL MACHINE (System 2).
# Its address is configured via APP1_URL in .env.
# ══════════════════════════════════════════════════════════════════════════════

services:

  # ── Traefik reverse proxy ─────────────────────────────────────────────────
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    entrypoint:
      - "/bin/sh"
      - "-c"
      - |
        cat > /etc/traefik/dynamic.yml << DYNEOF
        http:
          services:
            app1-backend:
              loadBalancer:
                servers:
                  - url: "$APP1_URL"
          routers:
            app1-external:
              rule: "PathPrefix(\`/\`)"
              entryPoints:
                - web
              service: app1-backend
              priority: 1
        DYNEOF
        exec traefik --configFile=/etc/traefik/traefik.yml
    environment:
      APP1_URL: ${APP1_URL:-http://host.docker.internal:8002}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - gateway_net
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"

  # ── Gateway API (FastAPI) ─────────────────────────────────────────────────
  gateway-api:
    build:
      context: ./gateway-api
      dockerfile: Dockerfile
    container_name: gateway-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: ${APP_VERSION:-0.3.0}
      SESSION_TIMEOUT_SECONDS: ${SESSION_TIMEOUT_SECONDS:-300}
      STALE_CHECK_INTERVAL_SECONDS: ${STALE_CHECK_INTERVAL_SECONDS:-60}
    networks:
      - gateway_net
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway-api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.gateway-api.entrypoints=web"
      - "traefik.http.routers.gateway-api.priority=10"
      - "traefik.http.services.gateway-api.loadbalancer.server.port=8000"

# ── App 1 (External Service) ────────────────────────────────────────────────
# App 1 runs on System 2 (separate physical machine).
# Its address is configured via APP1_URL in .env.
#
# For LAN deployment:  APP1_URL=http://<APP1_LAN_IP>:8002
# For local testing:   APP1_URL=http://host.docker.internal:8002

# ── Shared network ────────────────────────────────────────────────────────────
networks:
  gateway_net:
    driver: bridge
