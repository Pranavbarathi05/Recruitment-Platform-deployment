# ══════════════════════════════════════════════════════════════════════════════
# Recruitment Platform – Gateway
# ══════════════════════════════════════════════════════════════════════════════
# Services:
#   traefik       – reverse proxy (entry point)
#   gateway-api   – session control, health, execute (/api/*)
#   frontend      – React SPA (/, /login, /domains, /dashboard, etc.)
#
# Routing (file provider, priorities decide winner on overlap):
#   /api/*                          → gateway-api  (priority 10)
#   /auth/*                         → App 1 backend (priority 5)
#   /questions/*                    → App 1 backend (priority 5)
#   /submission/*                   → App 1 backend (priority 5)
#   /assessment/start|current|...   → App 1 backend (priority 5)
#   /coding/*                       → App 1 backend (priority 5)
#   /admin/*                        → App 1 backend (priority 5)
#   /challenge/*                    → SQLi challenge server on App 1
#                                     (APP1_CHALLENGE_URL, e.g. http://<APP1_LAN_IP>:8080;
#                                      App 1 publishes the challenge container on that host
#                                      port and firewalls it to this machine)
#   /* (everything else)            → frontend SPA (priority 1, catch-all)
# ══════════════════════════════════════════════════════════════════════════════

services:

  # ── Traefik reverse proxy ─────────────────────────────────────────────────
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    entrypoint:
      - "/bin/sh"
      - "-c"
      - |
        cat > /etc/traefik/dynamic.yml << DYNEOF
        http:
          services:
            app1-backend:
              loadBalancer:
                servers:
                  - url: "$APP1_URL"
            frontend-spa:
              loadBalancer:
                servers:
                  - url: "http://frontend:8080"
            gateway-api-svc:
              loadBalancer:
                servers:
                  - url: "http://gateway-api:8000"
            # Hands-On SQLi challenge pool. App-1's challenge server today;
            # add another server line (e.g. App-2's challenge URL) to
            # load-balance challenge-2 into the same pool later.
            challenge-svc:
              loadBalancer:
                servers:
                  - url: "${APP1_CHALLENGE_URL:-http://host.docker.internal:8080}"

          # Strip /challenge so the challenge server sees its native paths
          # (/, /login, /health) — exactly as when accessed directly on
          # APP-1:8080. /challenge and /challenge/ both resolve to /.
          middlewares:
            challenge-stripprefix:
              stripPrefix:
                prefixes:
                  - "/challenge"

          routers:
            gateway-api-file:
              rule: "PathPrefix(\`/api\`)"
              entryPoints:
                - web
              service: gateway-api-svc
              priority: 10

            app1-backend-routes:
              rule: "PathPrefix(\`/auth\`) || PathPrefix(\`/questions\`) || PathPrefix(\`/submission\`) || PathPrefix(\`/assessment/start\`) || PathPrefix(\`/assessment/current\`) || PathPrefix(\`/assessment/attempt\`) || PathPrefix(\`/coding\`) || PathPrefix(\`/admin\`)"
              entryPoints:
                - web
              service: app1-backend
              priority: 5

            challenge-routes:
              rule: "PathPrefix(\`/challenge\`)"
              entryPoints:
                - web
              service: challenge-svc
              middlewares:
                - challenge-stripprefix
              priority: 8

            frontend-spa:
              rule: "PathPrefix(\`/\`)"
              entryPoints:
                - web
              service: frontend-spa
              priority: 1

        DYNEOF
        exec traefik --configFile=/etc/traefik/traefik.yml
    environment:
      APP1_URL: ${APP1_URL:-http://host.docker.internal:8002}
      # Hands-On SQLi challenge server (Employee Portal). Published by App-1's
      # compose on its host (APP1_CHALLENGE_PORT there, default 8080) and
      # firewalled to this machine. LAN: http://<APP1_LAN_IP>:8080
      # (NEVER the dashboard :8080 on THIS machine — that is Traefik's own.)
      APP1_CHALLENGE_URL: ${APP1_CHALLENGE_URL:-http://host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - gateway_net
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"

  # ── Frontend (React SPA) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: gateway/frontend/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_API_URL: "."
    container_name: frontend
    restart: unless-stopped
    networks:
      - gateway_net
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Gateway API (FastAPI) ─────────────────────────────────────────────────
  gateway-api:
    build:
      context: ./gateway-api
      dockerfile: Dockerfile
    container_name: gateway-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: ${APP_VERSION:-0.3.0}
      SESSION_TIMEOUT_SECONDS: ${SESSION_TIMEOUT_SECONDS:-300}
      STALE_CHECK_INTERVAL_SECONDS: ${STALE_CHECK_INTERVAL_SECONDS:-60}
      COMPILER_URL: ${COMPILER_URL:-http://host.docker.internal:8001} #http://compiler-1:8000
      COMPILER_TIMEOUT: ${COMPILER_TIMEOUT:-60.0}
      # ── System 3 (Judge0) ──
      EXECUTION_BACKEND: ${EXECUTION_BACKEND:-judge0}
      JUDGE0_URL: ${JUDGE0_URL:-http://judge0-server:2358}
      JUDGE0_TIMEOUT: ${JUDGE0_TIMEOUT:-60.0}
      JUDGE0_AUTH_HEADER: ${JUDGE0_AUTH_HEADER:-X-Judge0-Token}
      JUDGE0_AUTH_TOKEN: ${JUDGE0_AUTH_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gateway_net
      - system3
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

# ── App 1 (External Service) ────────────────────────────────────────────────
# App 1 runs on System 3 (separate physical machine).
# Its address is configured via APP1_URL in .env.
# For LAN deployment:  APP1_URL=http://<APP1_LAN_IP>:8002
# For local testing:   APP1_URL=http://host.docker.internal:8002

# ── Shared networks ───────────────────────────────────────────────────────────
networks:
  gateway_net:
    driver: bridge
  # External network shared with the Judge0 System 3 stack.
  # Create it once:  docker network create system3
  system3:
    external: true
