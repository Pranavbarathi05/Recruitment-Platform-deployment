# ══════════════════════════════════════════════════════════════════════════════
# Recruitment Platform – Gateway
# ══════════════════════════════════════════════════════════════════════════════
# Services:
#   traefik       – reverse proxy (entry point)
#   gateway-api   – session control, health, execute (/api/*)
#   frontend      – React SPA (/, /login, /domains, /dashboard, etc.)
#
# Routing (file provider, priorities decide winner on overlap):
#   /api/*                          → gateway-api  (priority 10)
#   /questions/*, /submission/*     → App 1 backend (priority 5, external)
#   /assessment/start|current|...   → App 1 backend (priority 5)
#   /* (everything else)            → frontend SPA (priority 1, catch-all)
#
# NOTE: /admin routes go to frontend SPA catch-all. Admin panel access
# is not routed through the gateway — admins use App 1 directly.
# ══════════════════════════════════════════════════════════════════════════════

services:

  # ── Traefik reverse proxy ─────────────────────────────────────────────────
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    entrypoint:
      - "/bin/sh"
      - "-c"
      - |
        cat > /etc/traefik/dynamic.yml << DYNEOF
        http:
          services:
            app1-backend:
              loadBalancer:
                servers:
                  - url: "$APP1_URL"
            frontend-spa:
              loadBalancer:
                servers:
                  - url: "http://frontend:8080"
            gateway-api-svc:
              loadBalancer:
                servers:
                  - url: "http://gateway-api:8000"

          routers:
            gateway-api-file:
              rule: "PathPrefix(\`/api\`)"
              entryPoints:
                - web
              service: gateway-api-svc
              priority: 10

            app1-backend-routes:
              rule: "PathPrefix(\`/questions\`) || PathPrefix(\`/submission\`) || PathPrefix(\`/assessment/start\`) || PathPrefix(\`/assessment/current\`) || PathPrefix(\`/assessment/attempt\`)"
              entryPoints:
                - web
              service: app1-backend
              priority: 5

            frontend-spa:
              rule: "PathPrefix(\`/\`)"
              entryPoints:
                - web
              service: frontend-spa
              priority: 1

        DYNEOF
        exec traefik --configFile=/etc/traefik/traefik.yml
    environment:
      APP1_URL: ${APP1_URL:-http://host.docker.internal:8002}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - gateway_net
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"

  # ── Frontend (React SPA) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: gateway/frontend/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_API_URL: "."
    container_name: frontend
    restart: unless-stopped
    networks:
      - gateway_net
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Gateway API (FastAPI) ─────────────────────────────────────────────────
  gateway-api:
    build:
      context: ./gateway-api
      dockerfile: Dockerfile
    container_name: gateway-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: ${APP_VERSION:-0.3.0}
      SESSION_TIMEOUT_SECONDS: ${SESSION_TIMEOUT_SECONDS:-300}
      STALE_CHECK_INTERVAL_SECONDS: ${STALE_CHECK_INTERVAL_SECONDS:-60}
      COMPILER_URL: ${COMPILER_URL:-http://compiler-1:8000}
      COMPILER_TIMEOUT: ${COMPILER_TIMEOUT:-60.0}
    networks:
      - gateway_net
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

# ── App 1 (External Service) ────────────────────────────────────────────────
# App 1 runs on System 3 (separate physical machine).
# Its address is configured via APP1_URL in .env.
# For LAN deployment:  APP1_URL=http://<APP1_LAN_IP>:8002
# For local testing:   APP1_URL=http://host.docker.internal:8002

# ── Shared network ────────────────────────────────────────────────────────────
networks:
  gateway_net:
    driver: bridge
