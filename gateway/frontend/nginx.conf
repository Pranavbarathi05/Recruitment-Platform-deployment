# ══════════════════════════════════════════════════════════════════════════════
# Nginx — Recruitment Frontend SPA Server
#
# Serves the Vite-built static assets and falls back to index.html for all
# client-side routes. Does NOT proxy API calls — those go through Traefik.
# ══════════════════════════════════════════════════════════════════════════════

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 256;

    # ── Static assets (fingerprinted by Vite) — long cache ───────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Monaco editor worker files (served by Vite) ─────────────────────────
    location /monacoeditorwork/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Favicon, robots, etc ─────────────────────────────────────────────────
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ── Pyodide / WASM assets ────────────────────────────────────────────────────
    location ~* \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location ~* \.wasm$ {
        default_type application/wasm;
        try_files $uri =404;
    }
    # ── SPA fallback — all other routes serve index.html ─────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
