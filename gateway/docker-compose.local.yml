# ══════════════════════════════════════════════════════════════════════════════
# Recruitment Platform – Local Development Stack
#
# Runs ALL services on a single machine for testing.
# This is NOT the production topology — it's for local development.
#
# Services:
#   traefik       – reverse proxy (entry point)
#   gateway-api   – session control plane + code execution proxy
#   frontend      – React SPA
#   app-1         – dsc-recruit backend
#   compiler-1    – code execution service
#
# Usage:
#   cp .env.example .env
#   # Edit .env with Supabase credentials and VITE_SUPABASE_*
#   docker compose -f docker-compose.local.yml up -d --build
#   curl http://localhost/               # Frontend SPA
#   curl http://localhost/api/health     # Gateway API
#   curl http://localhost:8001/health    # Compiler 1
#
# Shutdown:
#   docker compose -f docker-compose.local.yml down
# ══════════════════════════════════════════════════════════════════════════════

services:

  # ── Traefik reverse proxy ─────────────────────────────────────────────────
  traefik:
    image: traefik:v3.1
    container_name: traefik-local
    restart: unless-stopped
    entrypoint:
      - "/bin/sh"
      - "-c"
      - |
        cat > /etc/traefik/dynamic.yml << DYNEOF
        http:
          services:
            app1-backend:
              loadBalancer:
                servers:
                  - url: "http://app-1:8000"
            frontend-spa:
              loadBalancer:
                servers:
                  - url: "http://frontend:8080"
            gateway-api-svc:
              loadBalancer:
                servers:
                  - url: "http://gateway-api:8000"

          routers:
            gateway-api-local:
              rule: "PathPrefix(\`/api\`)"
              entryPoints:
                - web
              service: gateway-api-svc
              priority: 10

            app1-backend-local:
              rule: "PathPrefix(\`/questions\`) || PathPrefix(\`/submission\`) || PathPrefix(\`/assessment/start\`) || PathPrefix(\`/assessment/current\`) || PathPrefix(\`/assessment/attempt\`)"
              entryPoints:
                - web
              service: app1-backend
              priority: 5

            frontend-spa-local:
              rule: "PathPrefix(\`/\`)"
              entryPoints:
                - web
              service: frontend-spa
              priority: 1

        DYNEOF
        exec traefik --configFile=/etc/traefik/traefik.yml
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - gateway_net
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"

  # ── Frontend (React SPA) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: gateway/frontend/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_API_URL: "."
    container_name: frontend-local
    restart: unless-stopped
    networks:
      - gateway_net
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Gateway API (FastAPI) ─────────────────────────────────────────────────
  gateway-api:
    build:
      context: ./gateway-api
      dockerfile: Dockerfile
    container_name: gateway-api-local
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: ${APP_VERSION:-0.8.0}
      SESSION_TIMEOUT_SECONDS: ${SESSION_TIMEOUT_SECONDS:-300}
      STALE_CHECK_INTERVAL_SECONDS: ${STALE_CHECK_INTERVAL_SECONDS:-60}
      COMPILER_URL: http://compiler-1:8000
      COMPILER_TIMEOUT: ${COMPILER_TIMEOUT:-60.0}
    networks:
      - gateway_net
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── App 1 (dsc-recruit backend) ──────────────────────────────────────────
  app-1:
    build:
      context: ../
      dockerfile: gateway/app-1/Dockerfile
    container_name: app-1-local
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-https://your-project.supabase.co}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-your-service-role-key}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-your-jwt-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:80,http://localhost:5173}
      HOST: "0.0.0.0"
      PORT: "8000"
    networks:
      - gateway_net
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Compiler 1 (Code Execution Service) ───────────────────────────────────
  compiler-1:
    build:
      context: ../
      dockerfile: gateway/compiler-1/Dockerfile
    container_name: compiler-1-local
    restart: unless-stopped
    environment:
      COMPILER_VERSION: "0.1.0"
      MAX_CONCURRENT: ${MAX_CONCURRENT:-4}
    networks:
      - gateway_net
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

# ── Shared network ────────────────────────────────────────────────────────────
networks:
  gateway_net:
    driver: bridge
