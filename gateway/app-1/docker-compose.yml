# ══════════════════════════════════════════════════════════════════════════════
# App 1 — Standalone Docker Compose
#
# Runs the dsc-recruit backend independently from the Gateway.
# Does NOT require the Gateway, Traefik, or any other gateway service.
#
# C++/Java execution requires the self-hosted Judge0 stack:
# the app joins the external Judge0 network (system3) and talks to
# judge0-server directly — the same architecture gateway-api uses.
#
# The SQLi "Employee Portal" challenge server (Hands-On section) runs here
# too, as the `challenge-1` service (Dockerfile.challenge, stdlib only).
# It is published on the host as ${APP1_CHALLENGE_PORT:-8080} so the GATEWAY
# machine's Traefik can reach it over the LAN and route /challenge/* to it.
# Candidates must NEVER open http://<APP1_LAN_IP>:8080 directly — restrict
# the host firewall to the Gateway's IP only (see .env.example / DEPLOYMENT.md).
#
# For LAN deployment, App 1 listens on 0.0.0.0:8002 so the Gateway
# machine can reach it over the network.
#
# Usage:
#   cp .env.example .env
#   # Edit .env with real Supabase credentials
#   docker compose up -d --build
#   curl http://localhost:8002/
#   curl http://localhost:8080/health   # challenge server (Employee Portal)
#   docker compose down
# ══════════════════════════════════════════════════════════════════════════════

services:

  app-1:
    build:
      context: ../..
      dockerfile: gateway/app-1/Dockerfile

    container_name: app-1
    restart: unless-stopped

    environment:
      # ── Supabase (REQUIRED – app will not start without these) ──
      SUPABASE_URL: ${SUPABASE_URL:-https://your-project.supabase.co}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-your-service-role-key}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-your-anon-key-here}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-your-jwt-secret}

      # ── CORS ──
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:80,http://localhost:5173}

      # ── Server ──
      HOST: "0.0.0.0"
      PORT: "8000"

      # ── Compiler pool (Compiler-1 / Compiler-2 / Compiler-3) ──
      # The backend distributes code submissions round-robin across these
      # Judge0 nodes and fails over when one is unreachable. Use each compiler
      # machine's LAN address, e.g. http://<COMPILER1_LAN_IP>:2358.
      # Leave unset to use the single legacy JUDGE0_BASE_URL below.
      COMPILER_1_URL: ${COMPILER_1_URL:-}
      COMPILER_2_URL: ${COMPILER_2_URL:-}
      COMPILER_3_URL: ${COMPILER_3_URL:-}
      # Legacy single-node address (used only when no COMPILER_n_URL is set).
      JUDGE0_BASE_URL: ${JUDGE0_BASE_URL:-http://judge0-server:2358}
      JUDGE0_AUTH_TOKEN: ${JUDGE0_AUTH_TOKEN:-}
      JUDGE0_AUTH_HEADER: ${JUDGE0_AUTH_HEADER:-X-Judge0-Token}
      JUDGE0_JAVA_MEMORY_LIMIT_KB: ${JUDGE0_JAVA_MEMORY_LIMIT_KB:-2097152}
    networks:
      - system3
    ports:
      # Host port 8002 → Container port 8000
      # For LAN: Gateway reaches App 1 at <APP1_LAN_IP>:8002
      # Host port ${APP1_HOST_PORT:-8002} → container port 8000.
      # The Gateway reaches App-1 at <APP1_LAN_IP>:${APP1_HOST_PORT:-8002}.
      # Set APP1_API_BIND to this machine's LAN IP to stop it listening on any
      # other interface as well (the DOCKER-USER guard is the real restriction).
      - "${APP1_API_BIND:-0.0.0.0}:${APP1_HOST_PORT:-8002}:8000"

    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── SQLi challenge server (Hands-On "Employee Portal") ──────────────────────
  # Existing stdlib-only challenge (dsc-recruit/apps/backend/challenge_server).
  # Starts automatically with this stack. Container binds 0.0.0.0:8080.
  # HOST port ${APP1_CHALLENGE_PORT:-8080} is published ONLY so the Gateway
  # machine's Traefik can route /challenge/* to it across the physical
  # machines (Docker bridge networks do NOT span hosts). Firewall the host
  # port to the Gateway's IP (see .env.example) so candidates cannot reach
  # http://<APP1_LAN_IP>:8080 directly — they must go through the Gateway.
  challenge-1:
    build:
      context: ../..
      dockerfile: gateway/app-1/Dockerfile.challenge

    container_name: challenge-1
    restart: unless-stopped

    # Deliberately NO environment: no Supabase/platform credentials, no
    # secrets, no Docker socket, no privileged mode, no host file mounts.
    # The challenge uses only its own seeded SQLite database.

    networks:
      - challenge_net

    ports:
      # Host ${APP1_CHALLENGE_PORT:-8080} → challenge container 8080.
      # Gateway/Traefik target: APP1_CHALLENGE_URL=http://<APP1_LAN_IP>:8080
      - "${APP1_CHALLENGE_BIND:-0.0.0.0}:${APP1_CHALLENGE_PORT:-8080}:8080"

    expose:
      - "8080"

networks:
  # External network shared with the Judge0 System 3 stack.
  # Create it once:  docker network create system3
  system3:
    external: true

  # Internal-only network for challenge containers (challenge-1 now,
  # challenge-2 later on App-2). Nothing outside App-1's compose joins it;
  # the only path to a challenge is the host port above → Gateway/Traefik.
  challenge_net:
    driver: bridge
